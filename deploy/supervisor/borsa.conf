; Borsa realtime stack — supervisor programs (VDS)
; Kopyala: /etc/supervisor/conf.d/borsa.conf
; Sonra:  sudo supervisorctl reread && sudo supervisorctl update
;
; NOT: user / komut yollarını (php, proje dizini) kendi sunucuna göre düzelt.

; 1) Reverb — tarayıcılara dağıtan websocket santralı
[program:borsa-reverb]
process_name=%(program_name)s
command=php /var/www/borsa/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/borsa
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/borsa/storage/logs/reverb.log
stopwaitsecs=10

; 2) HAREM canlı dinleyici — HAREM socket'inden tick çeker
[program:borsa-harem-listen]
process_name=%(program_name)s
command=php /var/www/borsa/artisan harem:listen
directory=/var/www/borsa
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/borsa/storage/logs/harem-listen.log
stopwaitsecs=10

; 3) Queue worker — broadcast (ShouldBroadcast) job'larını işler
[program:borsa-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/borsa/artisan queue:work --sleep=1 --tries=1 --max-time=3600
directory=/var/www/borsa
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/borsa/storage/logs/queue.log
stopwaitsecs=10
